# boardly: the app, built from the Dockerfile. Start it with
#   docker compose up -d --build        (http://localhost:8080)
# Sign-in links are written to its log: docker compose logs boardly
#
# The `dev` profile holds the development services. `make dev-backend` starts and
# stops only those (or manually: docker compose --profile dev up -d mailpit sqlite-web).

name: boardly

services:
  boardly:
#    image: ghcr.io/danielraab/boardly:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      # Not BOARDLY_BASE_URL: compose reads the dev .env, where that points to Vite (:3000).
      BOARDLY_BASE_URL: ${BOARDLY_COMPOSE_BASE_URL:-http://localhost:8080}
      BOARDLY_LOG_FORMAT: text
    volumes:
      - boardly-data:/data

  mailpit:
    image: axllent/mailpit:v1.31
    profiles: [dev]
    ports:
      - "8025:8025" # web UI: http://localhost:8025
      - "1025:1025" # SMTP

  sqlite-web:
    image: coleifer/sqlite-web:latest
    profiles: [dev]
    # Run as the host user so files SQLite creates next to the DB (WAL/SHM) stay writable for the server.
    user: "${DEV_UID:-1000}:${DEV_GID:-1000}"
    environment:
      SQLITE_DATABASE: boardly.db
    volumes:
      - ./data:/data
    ports:
      - "8081:8080" # web UI: http://localhost:8081

volumes:
  boardly-data:
