
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boardly</title>
    <meta name="application-name" content="Boardly" />
    <!-- The server sets the map style from BOARDLY_MAP_STYLE_URL (see backend/internal/web). -->
    <meta name="boardly-map-style" content="https://tiles.openfreemap.org/styles/liberty" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.en.webmanifest" />
    <meta name="theme-color" content="#f4f4f5" />
    <script>
      // Applies the theme and its title bar colour and picks the manifest language
      // before first paint. Keep ids, colours, languages and keys in sync with
      // src/theme and src/i18n.
      (() => {
        const ids = ["white", "black", "sand", "sage", "fjord", "dusk", "ember"];
        const paper = {"white":"#f4f4f5","black":"#0a0a0a","sand":"#f4efe6","sage":"#edf2ec","fjord":"#242933","dusk":"#1e1a2a","ember":"#1f1b18"};
        const languages = ["en", "de"];
        const stored = (key) => {
          try {
            return localStorage.getItem(key);
          } catch {
            return null;
          }
        };
        let choice = stored("boardly.theme");
        if (!ids.includes(choice)) {
          const dark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
          choice = dark ? "black" : "white";
        }
        document.documentElement.dataset.theme = choice;
        document.querySelector('meta[name="theme-color"]').content = paper[choice];

        let language = stored("boardly.lang");
        if (!languages.includes(language)) {
          const preferred = navigator.languages ?? [navigator.language];
          language =
            preferred.map((l) => l?.split("-")[0]).find((l) => languages.includes(l)) ?? "en";
        }
        document.querySelector('link[rel="manifest"]').href = `/manifest.${language}.webmanifest`;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
