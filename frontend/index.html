
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Famodash</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // Applies the theme before first paint. Keep ids and key in sync with src/theme.
      (() => {
        const ids = ["white", "black", "sand", "sage", "fjord", "dusk", "ember"];
        let choice = null;
        try {
          choice = localStorage.getItem("famodash.theme");
        } catch {}
        if (!ids.includes(choice)) {
          const dark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
          choice = dark ? "black" : "white";
        }
        document.documentElement.dataset.theme = choice;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
