<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>{{.InviterName}} invited you to {{if .IsGroup}}the group{{else}}the dashboard{{end}} "{{.Title}}" on {{.AppName}}</title></head>
<body style="margin:0;padding:24px;background:#eef1f4;color:#1d2733;font-family:system-ui,sans-serif;">
<table role="presentation" width="100%" style="max-width:480px;margin:0 auto;background:#ffffff;border:1px solid #cbd3dc;border-radius:8px;">
<tr><td style="padding:32px;">
<p style="margin:0 0 16px;font-size:20px;font-weight:600;">{{.AppName}}</p>
<p style="margin:0 0 24px;">{{.InviterName}} invited you to {{if .IsGroup}}join the group{{else}}view the dashboard{{end}} "{{.Title}}" on {{.AppName}}.</p>
<p style="margin:0 0 24px;"><a href="{{.Link}}" style="display:inline-block;padding:12px 24px;background:#2563eb;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;">View invitation</a></p>
<p style="margin:0 0 24px;">Accept the invitation within {{.ValidDays}} days.</p>
<p style="margin:0;font-size:14px;color:#5a6878;">If you don't want this, you can ignore this email. Nothing changes until you accept.</p>
</td></tr>
</table>
</body>
</html>
